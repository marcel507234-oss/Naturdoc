<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haushaltsrechner</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e1e;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            display: flex;
            gap: 40px;
            max-width: 900px;
            width: 100%;
        }
        .controls {
            flex: 2;
            background: #2d2d2d;
            padding: 20px;
            border-radius: 8px;
        }
        .controls h2 {
            margin-top: 0;
            color: #4da6ff;
        }
        .section-title {
            margin-top: 20px;
            padding-bottom: 5px;
            border-bottom: 1px solid #555;
            color: #aaa;
            font-weight: bold;
        }
        .option {
            display: flex;
            margin: 10px 0;
            cursor: pointer;
        }
        .option label {
            cursor: pointer;
            flex: 1;
            padding-left: 10px;
        }
        .gauge-container {
            flex: 1;
            background: #2d2d2d;
            padding: 20px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .gauge-wrapper {
            position: relative;
            height: 500px;
            width: 60px;
            background: #111;
            border-radius: 30px;
            border: 2px solid #555;
            margin-top: 20px;
        }
        .zero-line {
            position: absolute;
            top: 250px;
            left: 0;
            right: 0;
            height: 2px;
            background: #fff;
            z-index: 10;
        }
        .zero-label {
            position: absolute;
            top: 242px;
            left: 70px;
            font-size: 13px;
            color: #fff;
            white-space: nowrap;
            line-height: 1.4;
        }
        .bar {
            position: absolute;
            left: 0;
            width: 100%;
            height: 0;
            background: #4caf50;
            transition: height 0.4s ease, background-color 0.4s ease, top 0.4s ease, bottom 0.4s ease;
        }
        .status-text {
            margin-top: 20px;
            font-size: 22px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="controls">
        <h2>Interaktiver Haushaltsrechner</h2>
        <p>Wähle politische Vorhaben aus, um die Auswirkungen auf das Staatsbudget zu simulieren.</p>

        <div class="section-title">GEPLANTE EINSPARUNGEN</div>
        <div class="option">
            <input type="checkbox" id="opt_e1" class="calc-cb" data-val="20">
            <label for="opt_e1">Streichung sämtlicher Asyl- und Integrationsleistungen</label>
        </div>
        <div class="option">
            <input type="checkbox" id="opt_e2" class="calc-cb" data-val="15">
            <label for="opt_e2">Reduzierung der EU-Beitragszahlungen</label>
        </div>
        <div class="option">
            <input type="checkbox" id="opt_e3" class="calc-cb" data-val="12">
            <label for="opt_e3">Einstellung der staatlichen Entwicklungshilfe</label>
        </div>
        <div class="option">
            <input type="checkbox" id="opt_e4" class="calc-cb" data-val="10">
            <label for="opt_e4">Streichung von Subventionen für „grüne“ Energien (EEG)</label>
        </div>
        <div class="option">
            <input type="checkbox" id="opt_e5" class="calc-cb" data-val="10">
            <label for="opt_e5">Streichung von Bürgergeld für abgelehnte Asylbewerber</label>
        </div>
        <div class="option">
            <input type="checkbox" id="opt_e6" class="calc-cb" data-val="8">
            <label for="opt_e6">Rückbau direkter Klimasubventionen</label>
        </div>
        <div class="option">
            <input type="checkbox" id="opt_e7" class="calc-cb" data-val="5">
            <label for="opt_e7">Stopp von Fördergeldern für NGOs und Vereine</label>
        </div>
        <div class="option">
            <input type="checkbox" id="opt_e8" class="calc-cb" data-val="5">
            <label for="opt_e8">Bürokratieabbau und Verkleinerung der Ministerien</label>
        </div>

        <div class="section-title">MEHRKOSTEN & STEUERAUSFÄLLE</div>
        <div class="option">
            <input type="checkbox" id="opt_m1" class="calc-cb" data-val="-195">
            <label for="opt_m1">Garantie für ein Rentenniveau von 70 %</label>
        </div>
        <div class="option">
            <input type="checkbox" id="opt_m2" class="calc-cb" data-val="-117">
            <label for="opt_m2">Einführung einer 25 % Einheitssteuer (Flat Tax)</label>
        </div>
        <div class="option">
            <input type="checkbox" id="opt_m3" class="calc-cb" data-val="-55">
            <label for="opt_m3">Abschaffung der Gewerbesteuer</label>
        </div>
        <div class="option">
            <input type="checkbox" id="opt_m4" class="calc-cb" data-val="-15">
            <label for="opt_m4">Abschaffung der Grundsteuer</label>
        </div>
        <div class="option">
            <input type="checkbox" id="opt_m5" class="calc-cb" data-val="-15">
            <label for="opt_m5">Umfassende physische Grenzsicherung</label>
        </div>
        <div class="option">
            <input type="checkbox" id="opt_m6" class="calc-cb" data-val="-15">
            <label for="opt_m6">Abschaffung der CO₂-Abgabe</label>
        </div>
        <div class="option">
            <input type="checkbox" id="opt_m7" class="calc-cb" data-val="-12">
            <label for="opt_m7">Streichung des Solidaritätszuschlags</label>
        </div>
        <div class="option">
            <input type="checkbox" id="opt_m8" class="calc-cb" data-val="-9">
            <label for="opt_m8">Komplette Abschaffung der Erbschaftsteuer</label>
        </div>
        <div class="option">
            <input type="checkbox" id="opt_m9" class="calc-cb" data-val="-8">
            <label for="opt_m9">Senkung der Energiesteuer auf Kraftstoffe</label>
        </div>
        <div class="option">
            <input type="checkbox" id="opt_m10" class="calc-cb" data-val="-2">
            <label for="opt_m10">Staatlich finanzierter Basis-Rundfunk (GEZ-Ersatz)</label>
        </div>
    </div>

    <div class="gauge-container">
        <h3>Haushalts-Status</h3>
        <div class="gauge-wrapper">
            <div class="zero-line"></div>
            <div class="zero-label">493 Mrd €<br>Status Quo. Reicht gerade so ungefähr.</div>
            <div class="bar" id="budgetBar"></div>
        </div>
        <div class="status-text" id="statusText">Budget: 493 Mrd €</div>
    </div>
</div>

<script>
    const checkboxes = document.querySelectorAll('.calc-cb');
    const budgetBar = document.getElementById('budgetBar');
    const statusText = document.getElementById('statusText');

    const baseBudget = 493;
    const scaleFactor = 0.5; // Dämpft den optischen Ausschlag

    function updateGauge() {
        let difference = 0;
        checkboxes.forEach(cb => {
            if (cb.checked) {
                difference += parseFloat(cb.getAttribute('data-val'));
            }
        });

        let currentBudget = baseBudget + difference;
        
        // Text Update
        statusText.innerText = "Budget: " + currentBudget + " Mrd €";
        statusText.style.color = getColor(difference);

        // Balken Update
        let barHeight = Math.abs(difference) * scaleFactor;
        if (barHeight > 240) barHeight = 240; // Begrenzung innerhalb der oberen/unteren 250px

        if (difference >= 0) {
            // Wächst nach oben von der Mitte
            budgetBar.style.bottom = "250px";
            budgetBar.style.top = "auto";
            budgetBar.style.height = barHeight + "px";
        } else {
            // Wächst nach unten von der Mitte
            budgetBar.style.top = "250px";
            budgetBar.style.bottom = "auto";
            budgetBar.style.height = barHeight + "px";
        }
        
        budgetBar.style.backgroundColor = getColor(difference);
    }

    function getColor(val) {
        if (val >= 0) return "#4caf50"; // Grün
        if (val > -50) return "#ff9800"; // Orange
        return "#ff4c4c"; // Rot
    }

    checkboxes.forEach(cb => {
        cb.addEventListener('change', updateGauge);
    });
</script>

</body>
</html>
